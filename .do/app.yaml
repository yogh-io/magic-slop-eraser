name: slopmop
region: ams
domains:
  - domain: slop.rip
    type: PRIMARY
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: yogh-io/slopmop
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: STATIC_DIR
        scope: RUN_TIME
        value: /app/dist

      # Persistence: DigitalOcean Spaces (S3-compatible). The S3Store backend
      # is selected when S3_BUCKET is set; STORAGE_DIR is then ignored. The
      # App Platform filesystem is ephemeral, so this is the only way to
      # survive redeploys.
      #
      # The bucket `slopmop-sessions` lives in ams3 and has a lifecycle rule
      # expiring objects 72h after last PUT (every mutation re-PUTs the
      # whole DocState blob, so an active session keeps resetting). Object
      # keys are `<S3_PREFIX>/<docId>.json` (default prefix "docs"). No
      # sweeper.
      #
      # The two SECRET-typed env vars below (S3_ACCESS_KEY_ID,
      # S3_SECRET_ACCESS_KEY) are stored encrypted in the DO console and
      # NOT committed here. They came from a Spaces key created via
      # `doctl spaces keys create` - the saved credentials live at
      # ~/.config/slopmop/spaces-credentials.json on the operator's
      # machine. Re-applying this spec via `doctl apps update --spec`
      # without those keys would zero out the credentials in production -
      # so prefer modifying the spec in-place via the DO console or the
      # API rather than re-pushing this file. This file is documentation
      # of the live state, not the deploy source (deploy_on_push uses the
      # spec already stored in DO).
      - key: S3_BUCKET
        scope: RUN_TIME
        value: slopmop-sessions
      - key: S3_ENDPOINT
        scope: RUN_TIME
        value: https://ams3.digitaloceanspaces.com
      - key: S3_REGION
        scope: RUN_TIME
        value: ams3
      # - key: S3_ACCESS_KEY_ID    # SECRET, set in DO console
      # - key: S3_SECRET_ACCESS_KEY # SECRET, set in DO console
